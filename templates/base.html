<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Văn bản pháp luật Xây dựng</title>
    <style>
        @font-face {
            font-family: 'SystemUI';
            src: local('DejaVu Sans'), local('Noto Sans'), local('Tinos'), local('sans-serif');
        }

        :root {
            --bg-primary: #0b0d11;
            --bg-secondary: #111319;
            --bg-card: #181b23;
            --bg-hover: #1e2130;
            --border: #232738;
            --text-primary: #e8eaed;
            --text-secondary: #989bab;
            --text-muted: #5f6378;
            --accent: #a58aff;
            --accent-hover: #b9a1ff;
            --accent-glow: rgba(165, 138, 255, 0.15);
            --green: #4ade80;
            --green-bg: rgba(74, 222, 128, 0.1);
            --blue: #60a5fa;
            --blue-bg: rgba(96, 165, 250, 0.1);
            --orange: #fb923c;
            --orange-bg: rgba(251, 146, 60, 0.1);
            --pink: #f472b6;
            --pink-bg: rgba(244, 114, 182, 0.1);
            --red: #f87171;
            --red-bg: rgba(248, 113, 113, 0.1);
            --teal: #2dd4bf;
            --teal-bg: rgba(45, 212, 191, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DejaVu Sans', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .app-layout {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== TOP NAV (thay cho sidebar) ===== */
        .top-nav {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            display: flex;
            align-items: center;
            gap: 24px;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 50;
            flex-shrink: 0;
        }

        .top-nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
            flex-shrink: 0;
        }

        .top-nav-brand .brand-sub {
            font-size: 10px;
            font-weight: 400;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: none;
        }

        .top-nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            overflow-x: auto;
        }

        .top-nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .top-nav-links a:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .top-nav-links a.active {
            color: var(--accent);
            background: var(--accent-glow);
        }

        .top-nav-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .top-nav-stats {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            padding: 4px 10px;
            background: var(--bg-card);
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .top-nav-stats b {
            color: var(--text-primary);
            font-weight: 600;
        }

        .topbar {
            padding: 16px 32px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .topbar .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
        }

        .topbar .breadcrumb span {
            color: var(--text-primary);
        }

        .topbar-actions {
            display: flex;
            gap: 8px;
        }

        .content-area {
            padding: 24px 32px 60px;
        }

        .search-section {
            margin-bottom: 24px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px 16px;
            transition: border-color 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-box .search-icon {
            color: var(--text-muted);
            font-size: 16px;
        }

        .search-box input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            padding: 12px 0;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
            align-items: center;
        }

        .filter-bar label {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-select {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 6px 10px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            min-width: 110px;
        }

        .filter-select:focus {
            border-color: var(--accent);
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        .btn-icon:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .doc-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
            transition: all 0.15s;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .doc-card:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
            transform: translateX(2px);
        }

        .doc-card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 6px;
        }

        .doc-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 5px;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .badge-luat { background: var(--blue-bg); color: var(--blue); }
        .badge-nghidinh { background: var(--orange-bg); color: var(--orange); }
        .badge-thongtu { background: var(--teal-bg); color: var(--teal); }
        .badge-quyetdinh { background: var(--pink-bg); color: var(--pink); }
        .badge-huongdan { background: var(--green-bg); color: var(--green); }
        .badge-tieuchuan { background: var(--red-bg); color: var(--red); }

        .doc-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
            flex: 1;
        }

        .doc-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-left: 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .doc-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .doc-summary {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
            margin-left: 0;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .pagination a, .pagination span {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            text-decoration: none;
            color: var(--text-secondary);
            background: var(--bg-card);
            border: 1px solid var(--border);
            transition: all 0.15s;
        }

        .pagination a:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .pagination .current {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .pagination .disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .btn-danger {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid transparent;
        }

        .btn-danger:hover {
            border-color: var(--red);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state .empty-icon {
            font-size: 48px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Detail page */
        .detail-header {
            margin-bottom: 24px;
        }

        .detail-header h1 {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .detail-meta .meta-item {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .detail-meta .meta-item b {
            color: var(--text-primary);
            font-weight: 600;
        }

        .detail-body {
            padding: 24px;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            line-height: 1.8;
        }

        .detail-body h1, .detail-body h2, .detail-body h3 {
            color: var(--accent);
            margin: 20px 0 10px;
        }

        .detail-body h1 { font-size: 20px; }
        .detail-body h2 { font-size: 17px; }
        .detail-body h3 { font-size: 15px; }

        .detail-body p {
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .detail-body strong {
            color: var(--text-primary);
        }

        .detail-body ul, .detail-body ol {
            margin: 8px 0 8px 20px;
            color: var(--text-secondary);
        }

        .detail-body li {
            margin-bottom: 4px;
        }

        .detail-body code {
            background: var(--bg-hover);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 13px;
        }

        /* Form page */
        .form-container {
            max-width: 800px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .form-group .form-input,
        .form-group .form-textarea,
        .form-group .form-select {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group .form-input:focus,
        .form-group .form-textarea:focus,
        .form-group .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-group .form-textarea {
            min-height: 300px;
            resize: vertical;
            font-family: 'DejaVu Sans Mono', 'Noto Sans Mono', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .form-group .form-input[type="file"] {
            padding: 8px;
        }

        .form-group .form-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .main-content {
                margin-left: 0;
            }
            .content-area {
                padding: 16px;
            }
            .topbar {
                padding: 12px 16px;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

        /* Action buttons row */
        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* ===== BACKGROUND DECORATION (Hermes-inspired) ===== */
        .main-content {
            position: relative;
            overflow: hidden;
        }

        /* Large watermark icon - balance scale + buildings */
        .bg-watermark {
            position: absolute;
            top: 50%;
            right: -5%;
            transform: translateY(-50%);
            width: min(75vw, 700px);
            height: auto;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
            color: white;
            user-select: none;
        }

        .bg-watermark svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Gradient glow */
        .main-content::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 80% 40%, rgba(165, 138, 255, 0.06), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== HERO SECTION ===== */
        .hero-section {
            position: relative;
            z-index: 1;
            margin-bottom: 28px;
            background: linear-gradient(135deg, rgba(165, 138, 255, 0.08), transparent 70%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px 32px 24px;
        }

        .hero-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hero-icon {
            font-size: 26px;
        }

        .hero-highlight {
            background: linear-gradient(135deg, var(--accent), #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0 0 20px;
            line-height: 1.5;
        }

        .hero-stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hero-stat-card {
            flex: 1;
            min-width: 100px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: center;
            transition: all 0.2s;
            text-decoration: none;
            color: var(--text);
        }

        .hero-stat-card:hover {
            background: rgba(165, 138, 255, 0.1);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .hero-stat-total {
            background: rgba(165, 138, 255, 0.08);
            border-color: var(--accent);
        }

        .hero-stat-number {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.2;
        }

        .hero-stat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== SECTION HEADERS ===== */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .section-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
        }

        .section-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ===== RECENT GRID ===== */
        .recent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .recent-card {
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
        }

        .recent-card:hover {
            border-color: var(--accent);
            background: rgba(165, 138, 255, 0.05);
            transform: translateY(-2px);
        }

        .recent-card-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .recent-sohieu {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
        }

        .recent-card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .recent-card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .recent-card-summary {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
            opacity: 0.8;
        }

        /* ===== CATEGORY GRID ===== */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .category-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
        }

        .category-card:hover {
            border-color: var(--accent);
            background: rgba(165, 138, 255, 0.08);
            transform: translateY(-2px);
        }

        .category-empty {
            opacity: 0.4;
            pointer-events: none;
        }

        .category-icon {
            font-size: 22px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(165, 138, 255, 0.1);
            border-radius: 8px;
            flex-shrink: 0;
        }

        .category-info {
            flex: 1;
            min-width: 0;
        }

        .category-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .category-count {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .category-arrow {
            font-size: 14px;
            color: var(--text-muted);
            opacity: 0.5;
        }

        .category-card:hover .category-arrow {
            opacity: 1;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Top Nav -->
        <nav class="top-nav">
            <a href="/" class="top-nav-brand">
                <span>&#9878;</span> Xây dựng
                <span class="brand-sub">Văn bản Pháp luật</span>
            </a>
            <div class="top-nav-links">
                <a href="/" class="{% if not search and not loai_filter %}active{% endif %}">&#127968; Tất cả</a>
                {% for l in loai_list %}
                <a href="/?loai={{ l|urlencode }}" class="{% if loai_filter == l %}active{% endif %}">&#128196; {{ l }}</a>
                {% endfor %}
            </div>
            <div class="top-nav-stats">
                Tổng <b>{{ total }}</b>
            </div>
            <div class="top-nav-actions">
                <a href="/them" class="btn btn-primary">
                    &#43; Thêm
                </a>
            </div>
        </nav>

        <!-- Main -->
        <main class="main-content">
            <div class="bg-watermark" aria-hidden="true">
                <svg viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Arc curves -->
                    <path d="M50 400 Q200 100 350 400" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
                    <path d="M20 440 Q200 60 380 440" stroke="currentColor" stroke-width="1" opacity="0.4"/>
                    <!-- Balance scale beam -->
                    <path d="M100 190 L300 190" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Center post -->
                    <path d="M200 190 L200 140" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Base -->
                    <path d="M170 140 L230 140" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M185 140 L200 120 L215 140" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>
                    <!-- Left pan -->
                    <path d="M105 195 L70 260 Q60 275 70 280 L120 280 Q130 275 120 260 L105 195" stroke="currentColor" stroke-width="2" fill="none"/>
                    <line x1="100" y1="198" x2="80" y2="255" stroke="currentColor" stroke-width="1.2"/>
                    <line x1="110" y1="198" x2="115" y2="255" stroke="currentColor" stroke-width="1.2"/>
                    <!-- Right pan -->
                    <path d="M295 195 L330 260 Q340 275 330 280 L280 280 Q270 275 280 260 L295 195" stroke="currentColor" stroke-width="2" fill="none"/>
                    <line x1="300" y1="198" x2="320" y2="255" stroke="currentColor" stroke-width="1.2"/>
                    <line x1="290" y1="198" x2="285" y2="255" stroke="currentColor" stroke-width="1.2"/>
                    <!-- Building left -->
                    <rect x="30" y="290" width="50" height="180" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
                    <line x1="45" y1="320" x2="45" y2="340" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <line x1="65" y1="320" x2="65" y2="340" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <!-- Building middle -->
                    <rect x="90" y="240" width="70" height="230" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
                    <line x1="105" y1="270" x2="105" y2="290" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <line x1="125" y1="270" x2="125" y2="290" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <line x1="145" y1="270" x2="145" y2="290" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <line x1="105" y1="320" x2="105" y2="340" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <line x1="125" y1="320" x2="125" y2="340" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <!-- Building right -->
                    <rect x="290" y="210" width="80" height="260" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
                    <line x1="305" y1="240" x2="305" y2="260" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <line x1="325" y1="240" x2="325" y2="260" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <line x1="345" y1="240" x2="345" y2="260" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <line x1="305" y1="290" x2="305" y2="310" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <line x1="325" y1="290" x2="325" y2="310" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <line x1="345" y1="290" x2="345" y2="310" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                    <!-- Sparkle dots -->
                    <circle cx="200" cy="80" r="3" fill="currentColor" opacity="0.5"/>
                    <circle cx="350" cy="130" r="2" fill="currentColor" opacity="0.35"/>
                    <circle cx="50" cy="130" r="2" fill="currentColor" opacity="0.35"/>
                    <circle cx="270" cy="90" r="1.5" fill="currentColor" opacity="0.25"/>
                </svg>
            </div>
            <div class="topbar">
                <div class="breadcrumb">
                    <span style="margin-right:6px;">&#128196;</span>
                    {% block breadcrumb %}Trang chủ{% endblock %}
                </div>
            </div>
            <div class="content-area">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
